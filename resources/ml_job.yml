resources:
  jobs:
    ifrs17_05_ml:
      name: ifrs17_05_ml
      description: "LIC emergence challenger model: train, register (@champion), batch-score gld_lic_ultimates. Never called interactively."
      tags:
        project: ifrs17_workbench
      environments:
        - environment_key: default
          spec:
            client: "5"
            dependencies:
              - lightgbm
      tasks:
        - task_key: lic_emergence
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/05_models.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
